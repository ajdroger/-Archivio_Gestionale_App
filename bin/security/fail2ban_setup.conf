# Fail2Ban Configuration for Fratellanza Militare App
# This file serves as a template for system administrators.
# Place these contents in /etc/fail2ban/jail.local and filter.d/

# --- jail.local ---

[fratellanza-app]
enabled = true
port    = http,https
filter  = fratellanza-auth
logpath = /var/www/fratellanza-militare-archivio/logs/app.log
maxretry = 5
findtime = 600
bantime = 3600

# --- filter.d/fratellanza-auth.conf ---

[Definition]
failregex = ^.*"event":"AUTH_FAILURE".*"ip":"<HOST>".*$
            ^.*"event":"CSRF_FAILURE".*"ip":"<HOST>".*$
            ^.*"event":"SQL_INJECTION_ATTEMPT".*"ip":"<HOST>".*$

ignoreregex = 
