version: '3.8'

services:
  # --- Application Service (PHP 8.2 + Apache) ---
  app:
    image: php:8.2-apache
    container_name: mcag_app_prod
    restart: always
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-mcag_prod}
      - DB_USER=${DB_USER:-mcag_user}
      - DB_PASS=${DB_PASS:-secure_pass_change_me}
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ../../:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - db
    networks:
      - mcag_network
    # Install necessary PHP extensions via entrypoint or build
    # For a universal image, we use a simple command to ensure standard exts are present
    # In a real scenario, we would use a custom Dockerfile.
    # Here we simulate a pre-built image usage or on-the-fly setup.
    command: /bin/bash -c "docker-php-ext-install pdo pdo_mysql && a2enmod rewrite && apache2-foreground"

  # --- Database Service (MySQL 8.0) ---
  db:
    image: mysql:8.0
    container_name: mcag_db_prod
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-mcag_prod}
      MYSQL_USER: ${DB_USER:-mcag_user}
      MYSQL_PASSWORD: ${DB_PASS:-secure_pass_change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_secure_pass}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - mcag_network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # --- Optional: Database Management ---
  pma:
    image: phpmyadmin/phpmyadmin
    container_name: mcag_pma_prod
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER:-mcag_user}
      PMA_PASSWORD: ${DB_PASS:-secure_pass_change_me}
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      - db
    networks:
      - mcag_network

volumes:
  db_data:

networks:
  mcag_network:
    driver: bridge
