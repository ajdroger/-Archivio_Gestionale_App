name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (Pinned for security/resolution)

    - name: Setup PHP
      uses: shivammathur/setup-php@c665c7a15b5295c2488ac8a87af9cb806cd72198 # v2.30.4 (Pinned for security/resolution)
      with:
        php-version: '8.2'
        extensions: mbstring, intl, pdo_mysql, bcmath

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run Static Analysis (PHPStan)
      run: vendor/bin/phpstan analyse -c config/phpstan.neon --memory-limit=1G

    - name: Run Unit Tests (Pest)
      run: vendor/bin/pest

    - name: Validazione Codice
      run: echo "Code Quality Checks Passed"
