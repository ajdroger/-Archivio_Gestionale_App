name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, intl, pdo_mysql, bcmath

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run Static Analysis (PHPStan)
      run: vendor/bin/phpstan analyse -c config/phpstan.neon --memory-limit=1G

    - name: Run Unit Tests (Pest)
      run: vendor/bin/pest

    - name: Validazione Codice
      run: echo "Code Quality Checks Passed"
